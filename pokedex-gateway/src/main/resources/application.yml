server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: pokedex-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 30s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            - id: pokedex-auth
              uri: ${AUTH_URL:http://localhost:8082}
              predicates:
                - Path=/oauth2/**,/auth/**,/.well-known/**
            - id: pokedex-api
              uri: ${API_URL:http://localhost:8081}
              predicates:
                - Path=/api/**
            - id: pokedex-api-docs
              uri: ${API_URL:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
                allowed-methods: GET,POST,PUT,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,X-Correlation-Id
                exposed-headers: X-Correlation-Id,Location,WWW-Authenticate
                max-age: 3600

gateway:
  auth:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:pokedex-api}
    jwks-uri: ${JWT_JWKS_URI:${AUTH_URL:http://localhost:8082}/oauth2/jwks}
    rules:
      - { method: OPTIONS, path: /**, access: PUBLIC }
      - { path: /oauth2/**, access: PUBLIC }
      - { path: /.well-known/**, access: PUBLIC }
      - { method: POST, path: /auth/register, access: PUBLIC }
      - { path: /v3/api-docs/**, access: PUBLIC }
      - { path: /swagger-ui/**, access: PUBLIC }
      - { path: /swagger-ui.html, access: PUBLIC }
      - { method: GET, path: /api/pokemon/**, access: PUBLIC }
      - { method: GET, path: /api/local-pokemon/**, access: PUBLIC }
      - { method: DELETE, path: /api/local-pokemon/**, access: ADMIN }
      - { path: /api/local-pokemon/**, access: AUTHENTICATED }

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    gateway.access: INFO
