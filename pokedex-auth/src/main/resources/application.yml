server:
  port: ${PORT:8082}
  shutdown: graceful
  error:
    include-stacktrace: never

spring:
  application:
    name: pokedex-auth
  datasource:
    url: jdbc:h2:mem:pokedex_auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

auth:
  token:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:pokedex-api}
    token-ttl: ${JWT_TTL:1h}
    keys:
      key-id: ${JWT_KEY_ID:}
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
  seed:
    demo-users: ${SEED_DEMO_USERS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pokedex_auth}
    username: ${DB_USER:pokedex}
    password: ${DB_PASSWORD:pokedex}
